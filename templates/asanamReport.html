<!DOCTYPE html>
<html lang="ta">

    <head>

    <meta charset="UTF-8" />

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap"
        rel="stylesheet"
    />

    <style>

@page {
size:A4;
margin:8mm;
}

body {
  font-family: "Noto Sans Tamil", sans-serif;
  font-size: 11px;
  margin:0;
}

/* FIXED PAGE BORDER */
.page-border{
    position:fixed;
    top:5mm;
    bottom:5mm;
    left:5mm;
    right:5mm;
    border:2px solid black;
    padding:8mm;
    box-sizing:border-box;
}

        .center {
        text-align: center;
        }

.sub_header {
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin:6px 0;
    padding:6px 0;
    background:#e6e6e6;
    border:1px solid #777;
    border-radius:4px;
}

        .header {
        text-align: center;
        line-height: 1.4;
        }

        .hr {
        border-top: 1px solid #000;
        margin: 10px 0;
        }

        table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
        }

        thead tr {
        border-bottom: 1px solid #000;
        }

        th,
        td {
        padding: 6px 4px;
        }

        th {
        font-weight: 600;
        }

.report th:nth-child(1),
.report td:nth-child(1){
width:40%;
}

.report th:nth-child(2),
.report td:nth-child(2){
width:20%;
}

.report th:nth-child(3),
.report td:nth-child(3){
width:15%;
text-align:center;
}

.report th:nth-child(4),
.report td:nth-child(4){
width:12%;
text-align:center;
}

.report th:nth-child(5),
.report td:nth-child(5){
width:13%;
text-align:center;
}

    </style>
    </head>
    <body>
<div class="page-border">
    <!-- HEADER -->
    <div class="header">
        <h3>

        C.S.I. கிறிஸ்துநாதர் ஆலயம்<br>

        1558, திருச்சி ரோடு, கோவை - 18.<br>

        Phone : 0422 - 2305155<br>

        E-mail : christchurchcbe@gmail.com
        |
        Web : www.Christchurchcbe.org
        </h3>
    </div>
    
    <!-- TITLE -->
    <div class="sub_header">
        <b>
        {{YEAR}} ம் ஆண்டு அசன நன்கொடையாளர்கள்
        </b>
    </div>
    
    <div class="hr"></div>

    <!-- TABLE -->
    <table class="report">
        <thead>
        <tr>
            <th>
            பெயர்
            </th>
            <th>
            இடம்
            </th>
            <th class="center">
            ரொக்கம்
            </th>
            <th class="center">
            அரிசி
            </th>
            <th class="center">
            கிடா
            </th>
        </tr>
        </thead>
        <tbody>

        <!--ROWS-->

        </tbody>
    </table>
    </div>
    </body>
</html>
