<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">

<style>
@page {
  size: A4;
  margin: 16mm 14mm;
}

body {
  margin: 0;
  font-family: "Noto Sans Tamil", sans-serif;
  font-size: 11px;
  line-height: 1.45;
  color: #000;
}

/* HEADER */
.header {
  text-align: center;
  padding-top: 6mm;
}

.header h1 {
  margin: 0;
  font-size: 15px;
  letter-spacing: 0.6px;
}

.header p {
  margin: 2px 0;
  font-size: 10px;
}

.header .title {
  margin-top: 6px;
  font-weight: bold;
  letter-spacing: 0.8px;
}

/* SINGLE TOP LINE ONLY */
.hr {
  border-top: 1px solid #000;
  margin: 10px 0;
}

/* TABLE STYLE – NO INNER LINES */
.table {
  width: 100%;
  border-collapse: collapse;
}

.table th {
  text-align: left;
  font-weight: bold;
  padding: 6px 4px;
}

/* Only bottom line under header row */
.table thead tr {
  border-bottom: 1px solid #000;
}

.table td {
  padding: 6px 4px;
}

/* Alignment */
.center { text-align: center; }
.right { text-align: right; }

/* Section headings like CASH A/C, BANK A/C */
.section {
  font-weight: bold;
  margin-top: 10px;
}


</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>CSI CHRIST CHURCH</h1>
  <h1>1558, TRICHY ROAD, COIMBATORE - 641018</h1>
  <div class="title">
    GENERAL FUND A/C – TRIAL BALANCE FROM {{FROM_DATE}} TO {{TO_DATE}}
  </div>
</div>

<div class="hr"></div>

<table class="table">
  <thead>
    <tr>
      <th style="width:8%">SI.No</th>
      <th style="width:32%">Description</th>
      <th style="width:15%">Opening Balance</th>
      <th style="width:15%">Dr Amount</th>
      <th style="width:15%">Cr Amount</th>
      <th style="width:15%">Closing Balance</th>
    </tr>
  </thead>
  <tbody>

    <tr>
      <td colspan="6" class="section"></td>
    </tr>

    <tr>
      <td></td>
      <td></td>
      <td class="right"></td>
      <td class="right"></td>
      <td class="right"></td>
      <td class="right"></td>
    </tr>

  </tbody>
</table>


</body>
</html>
