<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">

<style>
@page {
  margin: 20mm 15mm 20mm 15mm;
}

body {
  font-family: "Noto Sans Tamil", sans-serif;
  font-size: 12px;
  color: #222;
}

.header {
  text-align: center;
  margin-bottom: 10px;
}

.header .church-name {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.header .church-address {
  font-size: 12px;
  margin-top: 2px;
}

.report-title {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  margin: 14px 0 10px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  background: #5C95E0;
  color: white;
  padding: 8px 6px;
  font-weight: bold;
  border: 1px solid #ccc;
}

tbody td {
  padding: 6px 6px;
  border-bottom: 1px solid #e0e0e0;
}

tbody tr:nth-child(even) {
  background: #fafafa;
}

.center { text-align: center; }

footer {
  position: fixed;
  bottom: -12mm;
  width: 100%;
  text-align: center;
  font-size: 10px;
  color: #666;
}
</style>
</head>

<body>

<div class="header">
  <div class="church-name">CSI CHRIST CHURCH</div>
  <div class="church-address">
    1588, TRICHY ROAD, COIMBATORE – 641018
  </div>
</div>

<div class="report-title">
  MARRIAGE REPORT –
  <span style="font-weight: normal; font-size: 12px;">
    {{FROM_DATE}} to {{TO_DATE}}
  </span>
</div>

<table>
<thead>
<tr>
  <th class="center">Sl No</th>
  <th>Husband Name</th>
  <th>Husband Tamil Name</th>
  <th>Wife Name</th>
  <th>Wife Tamil Name</th>
  <th class="center">Marriage Date</th>
</tr>
</thead>
<tbody>
<!--ROWS-->
</tbody>
</table>

</body>
</html>
